spring.application.name=logger

spring.application.version=${project.version}

spring.data.mongodb.uri=${MONGO_DB_URI}
spring.data.mongodb.database=${DB_NAME}
spring.data.mongodb.username=${DB_USER}
spring.data.mongodb.password=${DB_PASS}

spring.rabbitmq.host=${RABBIT_HOST}
spring.rabbitmq.port=${RABBIT_PORT:5672}
spring.rabbitmq.username=${RABBIT_USER}
spring.rabbitmq.password=${RABBIT_PASS}

messaging.notifications.topic-name=notifications
messaging.notifications-logs.queue-name=logs
